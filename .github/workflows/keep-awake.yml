# Pings the Render free-tier backend so it doesn't sleep (it spins down after ~15 idle minutes).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: curl --silent --show-error --fail --max-time 120 --retry 2 https://nba-trade-analyzer-backend.onrender.com/health
